mutation CreateNewNote($notebookId: UUID!, $content: String!, $title: String!) @auth(level: USER) {
  note_insert(data: {
    notebookId: $notebookId,
    content: $content,
    title: $title,
    userId_expr: "auth.uid",
    createdAt_expr: "request.time",
    updatedAt_expr: "request.time"
  })
}

query GetNotesInNotebook($notebookId: UUID!) @auth(level: USER) {
  notes(where: {notebookId: {eq: $notebookId}, userId: {eq_expr: "auth.uid"}}) {
    id
    title
    content
    createdAt
    updatedAt
  }
}

mutation ShareNoteWithUser($noteId: UUID!, $sharedWithUserId: UUID!, $accessLevel: String!) @auth(level: USER) {
  sharedNote_insert(data: {
    noteId: $noteId,
    sharedWithUserId: $sharedWithUserId,
    accessLevel: $accessLevel,
    sharedAt_expr: "request.time"
  })
}

query ListAvailableTags @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public") {
  tags {
    id
    name
  }
}